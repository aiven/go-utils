version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - checkov@3.3.23
    - osv-scanner@2.6.0
    - trivy@0.75.0
    - trufflehog@3.97.9
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - gofmt@1.20.4
    - golangci-lint@2.14.0
    - markdownlint@0.45.0
    - prettier@3.9.9
    - yamllint@1.38.0
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
