version: 0.1
cli:
  version: 1.29.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - checkov@3.4.3
    - osv-scanner@2.7.1
    - trivy@0.76.2
    - trufflehog@3.99.8
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - gofmt@1.20.4
    - golangci-lint@2.15.0
    - markdownlint@0.50.0
    - prettier@3.9.10
    - yamllint@1.38.0
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
